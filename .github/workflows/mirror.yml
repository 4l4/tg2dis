name: tg2dis mirror

on:
  # cron у GitHub ненадёжен, поэтому он тут нужен лишь чтобы ИНОГДА стартовать джоб
  # (и восстановить цепочку, если она оборвётся). Сам джоб держит long polling ~5.5ч
  # и получает посты почти мгновенно; concurrency ставит следующий запуск встык.
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:          # ручной старт (и для «раскачки» цепочки после простоя)

# один запуск в момент времени; следующий ждёт в очереди и стартует встык
concurrency:
  group: tg2dis-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 350        # жёсткий предохранитель (лимит GitHub — 360 мин)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Long polling
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_SOURCE_CHAT_ID: ${{ secrets.TG_SOURCE_CHAT_ID }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          MAX_FILE_MB: "20"
          POLL_HOURS: "24"
          LOOP_MINUTES: "330"        # держим процесс ~5.5ч, потом штатный выход
          LONG_POLL_SECONDS: "50"    # getUpdates висит до 50с -> посты приходят почти мгновенно
        run: python poll_bot.py
