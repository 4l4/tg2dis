name: tg2dis mirror

on:
  # Непрерывность держит САМОЗАПУСК: каждый прогон в начале ставит в очередь следующего
  # (шаг "Queue successor"), а concurrency запускает его встык, как только текущий завершится.
  # Преемник встаёт в очередь ДО опроса — поэтому даже если прогон зависнет, его снимет
  # timeout-minutes, и уже готовый преемник сразу подхватит эстафету.
  # cron здесь — лишь бэкап на случай, если самозапуск не сработает (например, нет PAT).
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:          # ручной старт и самозапуск преемника

# один запуск в момент времени; следующий ждёт в очереди и стартует встык
concurrency:
  group: tg2dis-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 55         # авто-снятие зависшего прогона (штатно выходим на 50-й мин)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip            # кэш зависимостей — частые рестарты почти без накладных
      - run: pip install -r requirements.txt
      - name: Queue successor (self-chain)
        continue-on-error: true   # сбой самозапуска не должен ронять сам прогон
        env:
          GH_TOKEN: ${{ secrets.CHAIN_PAT }}
        run: |
          if [ -n "$GH_TOKEN" ]; then
            gh workflow run mirror.yml -R "${{ github.repository }}" && echo "преемник поставлен в очередь"
          else
            echo "CHAIN_PAT не задан — самозапуск пропущен (пока работает schedule-бэкап)"
          fi
      - name: Long polling
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_SOURCE_CHAT_ID: ${{ secrets.TG_SOURCE_CHAT_ID }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          DISCORD_ANNOUNCE_CHANNEL_ID: ${{ secrets.DISCORD_ANNOUNCE_CHANNEL_ID }}  # пусто -> канал по умолчанию из кода
          MAX_FILE_MB: "20"
          POLL_HOURS: "24"
          LOOP_MINUTES: "50"         # держим процесс ~50 мин, потом штатный выход
          LONG_POLL_SECONDS: "50"    # getUpdates висит до 50с -> посты приходят почти мгновенно
        run: python -u poll_bot.py   # -u: логи видны в Actions сразу, а не в конце прогона
